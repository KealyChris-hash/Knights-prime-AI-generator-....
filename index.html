<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knights Prime - AI Image & Video Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⚔️</text></svg>" />
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_ZmxlZXQtcGlrYS01NC5jbGVyay5hY2NvdW50cy5kZXYk" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
      padding: 0 20px;
      gap: 20px;
    }

    header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      white-space: nowrap;
    }

    #auth-btn {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    #auth-btn:hover {
      background: #9333ea;
      transform: translateY(-2px);
    }

    #auth-btn:active {
      transform: translateY(0);
    }

    .container {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .subtitle {
      color: #a0a0a0;
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #a0a0a0;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 14px;
      margin: 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="file"]:focus,
    select:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
      background: #333;
    }

    input[type="file"]::file-selector-button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: #9333ea;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    #generateBtn {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
      color: white;
    }

    #generateBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
    }

    #generateBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #loading {
      text-align: center;
      color: #a78bfa;
      margin: 20px 0;
      font-size: 14px;
      padding: 12px;
      background: rgba(167, 139, 250, 0.1);
      border-radius: 8px;
      border-left: 3px solid #a78bfa;
      display: none;
    }

    #loading.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    #error {
      text-align: center;
      color: #ff6b6b;
      margin: 20px 0;
      padding: 12px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 8px;
      border-left: 3px solid #ff6b6b;
      font-size: 14px;
      display: none;
    }

    #error.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    #result {
      margin-top: 30px;
    }

    #result img,
    #result video {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid #7c3aed;
      margin-bottom: 20px;
      animation: fadeIn 0.5s ease-in;
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .file-name {
      color: #a0a0a0;
      font-size: 12px;
      margin-top: 4px;
      min-height: 18px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .actions button {
      background: #333;
      color: #fff;
      padding: 10px 16px;
      font-size: 14px;
      flex: 1;
      min-width: 100px;
    }

    .actions button:hover:not(:disabled) {
      background: #555;
      transform: translateY(-2px);
    }

    .actions button:active:not(:disabled) {
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 15px;
        margin-bottom: 30px;
      }

      header h1 {
        font-size: 24px;
      }

      .container {
        padding: 25px;
      }

      .button-group {
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }

    /* Accessibility improvements */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>⚔️ Knights Prime AI</h1>
    <button id="auth-btn" aria-label="Authentication button">Login / Sign up</button>
  </header>

  <div class="container">
    <p class="subtitle">Generate stunning AI images & videos. Upload to transform or create from scratch.</p>

    <div class="input-group">
      <label for="prompt">Describe what you want to create</label>
      <input
        id="prompt"
        type="text"
        placeholder="Ex: cyberpunk knight, anime style, futuristic armor"
        maxlength="500"
        aria-label="Prompt input"
      />
    </div>

    <div class="input-group">
      <label for="upload">Upload Image or Video (Optional)</label>
      <input 
        id="upload" 
        type="file" 
        accept="image/*,video/*"
        aria-label="File upload input"
      />
      <div id="file-name" class="file-name" role="status" aria-live="polite"></div>
    </div>

    <div class="input-group">
      <label for="type">Generation Type</label>
      <select id="type" aria-label="Generation type selector">
        <option value="image">📷 Generate Image</option>
        <option value="video">🎬 Generate Video</option>
      </select>
    </div>

    <div class="button-group">
      <button id="generateBtn" aria-label="Generate content button">Generate ✨</button>
    </div>

    <div id="loading" role="status" aria-live="polite"></div>
    <div id="error" role="alert" aria-live="assertive"></div>
    <div id="result"></div>
  </div>

  <script>
    let clerk;
    let uploadedFile = null;
    let lastResultUrl = "";
    let isGenerating = false;
    let controller = null;

    const CONFIG = {
      MAX_FILE_SIZE: 50 * 1024 * 1024, // 50MB
      MIN_PROMPT_LENGTH: 3,
      MAX_PROMPT_LENGTH: 500,
      GENERATION_TIMEOUT: 120000, // 2 minutes
    };

    // ===== CLERK AUTHENTICATION =====
    async function initClerk() {
      try {
        const res = await fetch("/.netlify/functions/get-key");
        if (!res.ok) throw new Error("Failed to get Clerk key");
        
        const data = await res.json();
        clerk = window.Clerk;

        if (!clerk) {
          console.error("Clerk failed to load");
          return;
        }

        await clerk.load();

        const authBtn = document.getElementById("auth-btn");
        const updateAuthBtn = () => {
          if (clerk.user) {
            authBtn.innerText = `${clerk.user.firstName || "User"} - Logout`;
            authBtn.onclick = () => clerk.signOut();
          } else {
            authBtn.innerText = "Login / Sign up";
            authBtn.onclick = () => clerk.openSignIn();
          }
        };

        updateAuthBtn();
        clerk.addListener(({ user }) => updateAuthBtn());
      } catch (err) {
        console.error("Clerk init error:", err);
        showError("Authentication service unavailable. Some features may be limited.");
      }
    }

    // Initialize Clerk
    initClerk();

    // ===== FILE UPLOAD HANDLER =====
    document.getElementById("upload").addEventListener("change", (e) => {
      uploadedFile = null;
      const fileName = document.getElementById("file-name");

      if (e.target.files.length === 0) {
        fileName.textContent = "";
        return;
      }

      const file = e.target.files[0];

      // Validate file size
      if (file.size > CONFIG.MAX_FILE_SIZE) {
        fileName.textContent = `❌ File too large (max 50 MB, got ${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
        e.target.value = "";
        return;
      }

      // Validate file type
      const isImage = file.type.startsWith("image/");
      const isVideo = file.type.startsWith("video/");

      if (!isImage && !isVideo) {
        fileName.textContent = "❌ Only image or video files are supported";
        e.target.value = "";
        return;
      }

      uploadedFile = file;
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      const icon = isImage ? "🖼️" : "🎥";
      fileName.textContent = `✓ ${icon} ${file.name} (${sizeMB} MB)`;
    });

    // ===== SHOW RESULT WITH ACTIONS =====
    function showResult(type, url) {
      lastResultUrl = url;
      let media;
      
      if (type === "image") {
        media = `<img src="${url}" alt="Generated image" loading="lazy" />`;
      } else {
        media = `<video controls autoplay loop style="width:100%; border-radius:12px; border:2px solid #7c3aed;">
                   <source src="${url}" type="video/mp4" />
                   Your browser does not support the video tag.
                 </video>`;
      }

      document.getElementById("result").innerHTML = `
        ${media}
        <div class="actions">
          <button onclick="download()" aria-label="Download generated content">⬇️ Download</button>
          <button onclick="share()" aria-label="Share generated content">📤 Share</button>
          <button onclick="post()" aria-label="Post to Postbook">⏫ Postbook</button>
        </div>
      `;

      clearMessages();
    }

    // ===== MAIN GENERATE FUNCTION =====
    async function generate() {
      const prompt = document.getElementById("prompt").value.trim();
      const type = document.getElementById("type").value;
      const generateBtn = document.getElementById("generateBtn");

      // Validation
      if (!prompt) {
        showError("Please enter a prompt first");
        return;
      }

      if (prompt.length < CONFIG.MIN_PROMPT_LENGTH) {
        showError(`Prompt must be at least ${CONFIG.MIN_PROMPT_LENGTH} characters`);
        return;
      }

      // Video requires login
      if (type === "video" && !clerk?.user) {
        clerk?.openSignIn({ afterSignInUrl: window.location.href });
        return;
      }

      // Prevent duplicate requests
      if (isGenerating) {
        return;
      }

      isGenerating = true;
      generateBtn.disabled = true;
      clearMessages();
      showLoading(`Generating ${type === "video" ? "video" : "image"}... This may take 20-60 seconds. Please wait.`);
      document.getElementById("result").innerHTML = "";

      // Setup abort controller for timeout
      controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), CONFIG.GENERATION_TIMEOUT);

      try {
        let fileBase64 = null;
        let mimeType = null;

        // Convert uploaded file to base64
        if (uploadedFile) {
          try {
            const buffer = await uploadedFile.arrayBuffer();
            fileBase64 = btoa(String.fromCharCode(...new Uint8Array(buffer)));
            mimeType = uploadedFile.type;
          } catch (err) {
            showError("Failed to process uploaded file. Please try again.");
            return;
          }
        }

        // Call backend API
        const res = await fetch("/.netlify/functions/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            prompt,
            type,
            fileBase64,
            mimeType,
          }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.error || `Server error: ${res.status} ${res.statusText}`);
        }

        const data = await res.json();

        if (data.error) {
          showError(`Generation failed: ${data.error}`);
          return;
        }

        if (!data.url) {
          showError("No output URL received from server");
          return;
        }

        showResult(type, data.url);
      } catch (err) {
        clearTimeout(timeoutId);
        
        if (err.name === "AbortError") {
          showError("Generation timeout. The AI took too long. Please try again.");
        } else {
          console.error("Generate error:", err);
          showError(`Failed to generate content: ${err.message || "Unknown error"}`);
        }
      } finally {
        isGenerating = false;
        generateBtn.disabled = false;
        controller = null;
      }
    }

    // ===== POST TO POSTBOOK =====
    async function post() {
      if (!clerk?.user) {
        clerk?.openSignIn({ afterSignInUrl: window.location.href });
        return;
      }

      if (!lastResultUrl) {
        showError("No content to post. Generate something first.");
        return;
      }

      try {
        const token = await clerk.session.getToken();

        const res = await fetch("/.netlify/functions/post-to-postbook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            userId: clerk.user.id,
            mediaUrl: lastResultUrl,
            prompt: document.getElementById("prompt").value,
            mediaType: document.getElementById("type").value,
          }),
        });

        if (!res.ok) {
          throw new Error(`Server error: ${res.status}`);
        }

        const data = await res.json();

        if (data.error) {
          showError(`Failed to post: ${data.error}`);
          return;
        }

        showLoading("✅ Posted to Postbook!");
        setTimeout(() => clearLoading(), 3000);
      } catch (err) {
        console.error("Post error:", err);
        showError("Failed to post. Check console for details.");
      }
    }

    // ===== DOWNLOAD FUNCTION =====
    function download() {
      if (!lastResultUrl) return;

      try {
        const a = document.createElement("a");
        a.href = lastResultUrl;
        a.download = `knights-prime-${Date.now()}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        console.error("Download error:", err);
        showError("Failed to download. Please try right-clicking the media and selecting 'Save As'.");
      }
    }

    // ===== SHARE FUNCTION =====
    function share() {
      if (!lastResultUrl) return;

      if (navigator.share) {
        navigator
          .share({
            title: "Knights Prime AI",
            text: "Check out this AI-generated content!",
            url: lastResultUrl,
          })
          .catch(err => console.log("Share cancelled:", err));
      } else {
        navigator.clipboard
          .writeText(lastResultUrl)
          .then(() => showLoading("✅ Link copied to clipboard!"))
          .catch(err => {
            console.error("Copy error:", err);
            showError("Failed to copy link. Please try again.");
          });
      }
    }

    // ===== UI HELPERS =====
    function showLoading(message) {
      const el = document.getElementById("loading");
      el.textContent = message;
      el.classList.add("show");
      clearError();
    }

    function showError(message) {
      const el = document.getElementById("error");
      el.textContent = "❌ " + message;
      el.classList.add("show");
      clearLoading();
    }

    function clearMessages() {
      clearLoading();
      clearError();
    }

    function clearLoading() {
      const el = document.getElementById("loading");
      el.classList.remove("show");
      el.textContent = "";
    }

    function clearError() {
      const el = document.getElementById("error");
      el.classList.remove("show");
      el.textContent = "";
    }

    // ===== EVENT LISTENERS =====
    document.getElementById("generateBtn").addEventListener("click", generate);

    // Allow Enter key to generate
    document.getElementById("prompt").addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !isGenerating && !e.shiftKey) {
        e.preventDefault();
        generate();
      }
    });

    // Cleanup on page unload
    window.addEventListener("beforeunload", (e) => {
      if (isGenerating) {
        controller?.abort();
        e.preventDefault();
        e.returnValue = "Generation in progress. Are you sure you want to leave?";
      }
    });
  </script>
</body>
</html>
