<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postbook - Knights Prime AI</title>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_ZmxlZXQtcGlrYS01NC5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://fleeet-pika-54.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  onload="window.dispatchEvent(new Event('clerk-loaded'))"
></script>

<style>
  *{box-sizing:border-box}
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; background:#0a0a0a; color:#fff; margin:0; }
.nav { position:sticky; top:0; background:#111; border-bottom:1px solid #222; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; z-index:10; }
.nav h2 { margin:0; font-size:22px; color:#6d28d9; font-weight:800; }
.nav-right { display:flex; gap:10px; align-items:center; }
.btn { background:#6d28d9; border:none; padding:8px 16px; border-radius:8px; color:#fff; cursor:pointer; font-weight:600; }
.btn:hover { background:#7c3aed; }
.btn-ghost { background:#1a1a1a; }
.container { max-width:680px; margin:20px auto; padding:0 15px; }
.create-box { background:#111; padding:15px; border-radius:12px; border:1px solid #222; margin-bottom:20px; }
.create-header { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.avatar { width:40px; height:40px; border-radius:50%; background:#6d28d9; display:flex; align-items:center; justify-content:center; font-weight:bold; }
.create-input { flex:1; background:#1a1a1a; border:1px solid #333; border-radius:20px; padding:10px 15px; color:#fff; }
.tabs { display:flex; gap:10px; margin:10px 0; }
.tab { flex:1; padding:8px; background:#1a1a1a; border:none; color:#aaa; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; }
.tab.active { background:#6d28d9; color:#fff; }
.tab.locked { opacity:0.4; }
.gen-controls { display:flex; gap:10px; }
.gen-controls input,.gen-controls select { flex:1; background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:10px; color:#fff; }
.preview { margin-top:15px; border-radius:8px; overflow:hidden; background:#000; }
.preview img,.preview video { width:100%; display:block; }
.post-actions { display:flex; gap:10px; margin-top:10px; }
.post { background:#111; border:1px solid #222; border-radius:12px; margin-bottom:20px; }
.post-header { display:flex; align-items:center; gap:10px; padding:12px; }
.post-user { font-weight:600; font-size:15px; }
.post-time { font-size:12px; color:#666; }
.post img,.post video { width:100%; display:block; background:#000; }
.post-buttons { padding:10px 12px; display:flex; gap:15px; border-top:1px solid #222; }
.post-buttons button { background:none; border:none; color:#aaa; font-size:15px; cursor:pointer; display:flex; gap:6px; align-items:center; }
.post-buttons button:hover { color:#fff; }
.likes { padding:0 12px; font-weight:600; font-size:14px; }
.caption { padding:8px 12px; font-size:14px; line-height:1.4; }
.caption b { margin-right:5px; }
.comments { padding:0 12px 12px; font-size:14px; }
.comments div { margin-bottom:4px; }
.comment-input { display:flex; gap:8px; padding:0 12px 12px; }
.comment-input input { flex:1; margin:0; background:#1a1a1a; border:1px solid #333; border-radius:20px; padding:8px 12px; color:#fff; }
.comment-input button { background:#6d28d9; border:none; padding:0 15px; border-radius:20px; color:#fff; cursor:pointer; }
.hidden { display:none; }
.error-box { background:#3f1d1d; border:1px solid #ff4444; color:#ffaaaa; padding:10px; border-radius:8px; margin-top:10px; font-size:13px; }
</style>
</head>
<body>

<div class="nav">
  <h2>⚔️ Postbook</h2>
  <div class="nav-right" id="auth-area">
    <button class="btn btn-ghost" id="loginBtn">Login</button>
  </div>
</div>

<div class="container">
  <!-- CREATE POST BOX -->
  <div class="create-box" id="createBox">
    <div class="create-header">
      <div class="avatar" id="myAvatar">G</div>
      <input class="create-input" id="prompt" type="text" placeholder="What's on your mind? Generate AI image...">
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setMode('image')">📷 Image</button>
      <button class="tab" id="videoTab" onclick="setMode('video')">🎬 Video 🔒</button>
    </div>

    <div class="gen-controls">
      <select id="style">
        <option value="">Photorealistic</option>
        <option value=", anime style, by makoto shinkai, highly detailed">Anime</option>
        <option value=", 3d render, unreal engine, highly detailed">3D Render</option>
        <option value=", cinematic, dramatic lighting">Cinematic</option>
      </select>
      <button class="btn" id="generateBtn">Generate</button>
    </div>

    <div id="preview" class="preview hidden"></div>
    <div class="post-actions hidden" id="postActions">
      <button class="btn" id="postBtn">Post to Postbook</button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
    </div>
    <div id="status"></div>
    <div id="error" class="error-box hidden"></div>
  </div>

  <!-- FEED -->
  <div id="feed"></div>
</div>

<script>
// ========= CONFIG - PASTE YOUR FAL KEY HERE =========
const FAL_BROWSER_TOKEN = "fal28611def-fdfa-4f5c-ba27-8e5bc954791b:7b98680e445f68531712447a5f3f720c
const BOOK_KEY = "postbook_feed_v1";
const IMAGE_URL = "https://queue.fal.run/fal-ai/flux/schnell";
const VIDEO_URL = "https://queue.fal.run/fal-ai/kling-video/v1.6/text-to-video";
// ===================================================

let mode = 'image';
let lastGenerated = null;

function showError(msg) {
  const e = document.getElementById('error');
  e.innerHTML = `<b>Error:</b> ${msg}`;
  e.classList.remove('hidden');
}

window.addEventListener('clerk-loaded', async () => {
  await Clerk.load();
  setupAuth();
  loadFeed();
});

function setupAuth() {
  const authArea = document.getElementById('auth-area');
  const loginBtn = document.getElementById('loginBtn');

  if (Clerk.user) {
    const name = Clerk.user.firstName || Clerk.user.emailAddresses[0].emailAddress.split('@')[0];
    document.getElementById('myAvatar').innerText = name[0].toUpperCase();
    document.getElementById('prompt').placeholder = `What's on your mind, ${name}?`;
    authArea.innerHTML = '<div id="user-button"></div>';
    Clerk.mountUserButton(document.getElementById('user-button'));
    document.getElementById('videoTab').classList.remove('locked');
  } else {
    loginBtn.onclick = () => Clerk.openSignIn();
    document.getElementById('videoTab').classList.add('locked');
  }
}

function setMode(m) {
  if(m === 'video' &&!window.Clerk?.user) return Clerk.openSignIn();
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('preview').classList.add('hidden');
  document.getElementById('postActions').classList.add('hidden');
}

document.getElementById('generateBtn').onclick = async () => {
  document.getElementById('error').classList.add('hidden');
  if(FAL_BROWSER_TOKEN === "fal_PASTE_YOUR_REAL_KEY_HERE") {
    return showError("Paste your FAL KEY in line 78 first");
  }

  const prompt = document.getElementById('prompt').value;
  const style = document.getElementById('style').value;
  if(!prompt) return alert("Type what you want to generate");
  if(mode === 'video' &&!window.Clerk?.user) return Clerk.openSignIn();

  const finalPrompt = prompt + style + ", 8k, highly detailed";
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('status');
  btn.disabled = true; status.innerText = "Generating...";

  try {
    let url = mode==='image'? await genImage(finalPrompt, status) : await genVideo(finalPrompt, status);
    lastGenerated = {url, type: mode, prompt: prompt};
    document.getElementById('preview').innerHTML = mode==='image'? `<img src="${url}">` : `<video src="${url}" controls autoplay loop></video>`;
    document.getElementById('preview').classList.remove('hidden');
    document.getElementById('postActions').classList.remove('hidden');
    status.innerText = "";
  } catch(e) {
    status.innerText = "";
    showError(e.message);
  }
  btn.disabled = false;
}

document.getElementById('cancelBtn').onclick = () => {
  document.getElementById('preview').classList.add('hidden');
  document.getElementById('postActions').classList.add('hidden');
}

document.getElementById('postBtn').onclick = () => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  feed.unshift({
    id: Date.now(),
    user: Clerk.user.emailAddresses[0].emailAddress.split('@')[0],
    userId: Clerk.user.id,
    media_url: lastGenerated.url,
    type: lastGenerated.type,
    prompt: lastGenerated.prompt,
    likes: [],
    comments: [],
    created_at: Date.now()
  });
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  document.getElementById('preview').classList.add('hidden');
  document.getElementById('postActions').classList.add('hidden');
  document.getElementById('prompt').value = '';
  loadFeed();
}

async function genImage(prompt, status) {
  status.innerText = "Generating image... ~5s";
  const res = await fetch(IMAGE_URL, {method:"POST", headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN,"Content-Type":"application/json"}, body:JSON.stringify({prompt})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.detail || "Image failed. Check Fal key.");
  return data.images[0].url;
}

async function genVideo(prompt, status) {
  const res = await fetch(VIDEO_URL, {method:"POST", headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN,"Content-Type":"application/json"}, body:JSON.stringify({prompt, duration:"5"})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.detail || "Video failed");
  const request_id = data.request_id;
  status.innerText = "Generating video... ~30s";
  while(true) {
    await new Promise(r=>setTimeout(r,3000));
    const statusRes = await fetch(`https://queue.fal.run/fal-ai/kling-video/v1.6/requests/${request_id}/status`, {headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN}});
    const final = await statusRes.json();
    if(final.response?.video) return final.response.video.url;
    if(final.status === 'FAILED') throw new Error("Video generation failed");
  }
}

function loadFeed() {
  const feedDiv = document.getElementById('feed');
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  if(feed.length === 0) {
    feedDiv.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">No posts yet. Be the first to post! 🚀</div>';
    return;
  }
  feedDiv.innerHTML = feed.map(p => `
    <div class="post">
      <div class="post-header">
        <div class="avatar">${p.user[0].toUpperCase()}</div>
        <div>
          <div class="post-user">${p.user}</div>
          <div class="post-time">${new Date(p.created_at).toLocaleString()}</div>
        </div>
      </div>
      ${p.type==='image'? `<img src="${p.media_url}">` : `<video src="${p.media_url}" controls></video>`}
      <div class="caption"><b>${p.user}</b> ${p.prompt}</div>
      <div class="likes">${p.likes.length} likes</div>
      <div class="post-buttons">
        <button onclick="toggleLike(${p.id})">❤️ Like</button>
        <button onclick="document.getElementById('comment-${p.id}').focus()">💬 Comment</button>
      </div>
      <div class="comments" id="comments-${p.id}">
        ${p.comments.map(c=>`<div><b>${c.user}</b> ${c.text}</div>`).join('')}
      </div>
      <div class="comment-input">
        <input id="comment-${p.id}" placeholder="Write a comment...">
        <button onclick="addComment(${p.id})">Post</button>
      </div>
    </div>
  `).join('');
}

window.toggleLike = (id) => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  let post = feed.find(p=>p.id===id);
  const user = Clerk.user.emailAddresses[0].emailAddress.split('@')[0];
  if(post.likes.includes(user)) post.likes = post.likes.filter(u=>u!==user);
  else post.likes.push(user);
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  loadFeed();
}

window.addComment = (id) => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  const input = document.getElementById(`comment-${id}`);
  if(!input.value.trim()) return;
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  let post = feed.find(p=>p.id===id);
  post.comments.push({user: Clerk.user.emailAddresses[0].emailAddress.split('@')[0], text: input.value});
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  input.value = '';
  loadFeed();
}
</script>
</body>
</html>
