<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knights Prime - AI Instagram</title>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_ZmxlZXQtcGlrYS01NC5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://fleeet-pika-54.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  onload="window.dispatchEvent(new Event('clerk-loaded'))"
></script>

<style>
  *{box-sizing:border-box}
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; background:#000; color:#fff; margin:0; }
.nav { position:sticky; top:0; background:#111; border-bottom:1px solid #333; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; z-index:10; }
.nav h2 { margin:0; font-size:20px; color:#6d28d9; }
.container { max-width:600px; margin:0 auto; padding:20px; }
.box { background:#111; padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid #222; }
.tabs { display:flex; gap:10px; margin-bottom:15px; }
.tab { flex:1; padding:10px; background:#1a1a1a; border:none; color:#aaa; border-radius:8px; cursor:pointer; font-weight:600; }
.tab.active { background:#6d28d9; color:#fff; }
.tab.locked { opacity:0.4; cursor:not-allowed; }
  input, select, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size:15px; }
  button.generate { background:#6d28d9; border:none; cursor:pointer; font-weight:bold; }
  button.generate:hover { background:#7c3aed; }
  button:disabled { background:#444; cursor:not-allowed; }
  #status { margin-top:10px; font-size:14px; color:#aaa; text-align:center; }
  #result img, #result video { width:100%; border-radius:8px; margin-top:15px; }
  label { font-size:13px; color:#aaa; margin-top:8px; display:block; }
.post { background:#111; border:1px solid #222; border-radius:8px; margin-bottom:20px; }
.post-header { display:flex; align-items:center; gap:10px; padding:12px; }
.avatar { width:32px; height:32px; border-radius:50%; background:#6d28d9; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; }
.post-user { font-weight:600; font-size:14px; }
.post img,.post video { width:100%; display:block; background:#000; }
.post-actions { padding:10px 12px; display:flex; gap:15px; }
.post-actions button { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0; width:auto; }
.likes { padding:0 12px; font-weight:600; font-size:14px; }
.caption { padding:0 12px 12px; font-size:14px; line-height:1.4; }
.caption b { margin-right:5px; }
.comments { padding:0 12px 12px; font-size:14px; }
.comments div { margin-bottom:4px; }
.comments b { color:#fff; margin-right:5px; }
.comment-input { display:flex; gap:8px; padding:0 12px 12px; }
.comment-input input { flex:1; margin:0; }
.comment-input button { width:auto; margin:0; background:#6d28d9; border:none; padding:0 15px; }
.hidden { display:none; }
.empty-feed { text-align:center; color:#666; padding:40px 20px; }
.error-box { background:#3f1d1d; border:1px solid #ff4444; color:#ffaaaa; padding:10px; border-radius:8px; margin-top:10px; font-size:13px; }
</style>
</head>
<body>

<div class="nav">
  <h2>⚔️ Knights Prime</h2>
  <div id="auth-area"><button id="loginBtn" style="background:#6d28d9;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;">Login</button></div>
</div>

<div class="container">
  <div class="box">
    <h3 style="margin-top:0;">Create</h3>
    <div class="tabs">
      <button class="tab active" onclick="setMode('image')">Image</button>
      <button class="tab" id="videoTab" onclick="setMode('video')">Video 🔒</button>
    </div>

    <label>Describe your creation</label>
    <input id="prompt" type="text" placeholder="e.g: Dragon striker, golden knight">

    <label>Style</label>
    <select id="style">
      <option value="">Photorealistic</option>
      <option value=", anime style, by makoto shinkai, studio ghibli, highly detailed">Anime</option>
      <option value=", 3d render, blender, octane render, unreal engine, highly detailed">3D Render</option>
      <option value=", oil painting, renaissance, detailed brush strokes, museum quality">Oil Painting</option>
      <option value=", cinematic, 35mm lens, dramatic lighting, film still">Cinematic</option>
      <option value=", pixel art, 16-bit, game asset, detailed">Pixel Art</option>
    </select>

    <button class="generate" id="generateBtn">Generate Image</button>
    <button id="postBtn" class="hidden">Post to Feed</button>
    <div id="status"></div>
    <div id="error" class="hidden"></div>
    <div id="result"></div>
  </div>

  <div id="feed"></div>
</div>

<script>
// ========= CONFIG - PASTE YOUR FAL KEY HERE =========
const FAL_BROWSER_TOKEN = "fal_PASTE_YOUR_REAL_KEY_HERE";
const BOOK_KEY = "kp_instagram_feed_v2";
const IMAGE_URL = "https://queue.fal.run/fal-ai/flux/schnell";
const VIDEO_URL = "https://queue.fal.run/fal-ai/kling-video/v1.6/text-to-video";
// ===================================================

let mode = 'image';
let lastGenerated = null;

function showError(msg) {
  const e = document.getElementById('error');
  e.innerHTML = `<b>Error:</b> ${msg}`;
  e.classList.remove('hidden');
}

window.addEventListener('clerk-loaded', async () => {
  try {
    await Clerk.load();
    setupAuth();
    loadFeed();
  } catch(err) {
    showError("Clerk failed to load. Did you add https://kealychris-hash.github.io to Clerk Domains?");
  }
});

function setupAuth() {
  const authArea = document.getElementById('auth-area');
  const loginBtn = document.getElementById('loginBtn');

  if (Clerk.user) {
    authArea.innerHTML = '<div id="user-button"></div>';
    Clerk.mountUserButton(document.getElementById('user-button'));
    document.getElementById('videoTab').classList.remove('locked');
  } else {
    loginBtn.onclick = () => Clerk.openSignIn();
    document.getElementById('videoTab').classList.add('locked');
  }
}

function setMode(m) {
  if(m === 'video' &&!window.Clerk?.user) return Clerk.openSignIn();
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('generateBtn').innerText = m === 'image'? 'Generate Image' : 'Generate 5s Video';
  document.getElementById('result').innerHTML = '';
  document.getElementById('postBtn').classList.add('hidden');
  document.getElementById('status').innerText = '';
  document.getElementById('error').classList.add('hidden');
}

document.getElementById('generateBtn').onclick = async () => {
  document.getElementById('error').classList.add('hidden');

  if(FAL_BROWSER_TOKEN === "fal_PASTE_YOUR_REAL_KEY_HERE") {
    return showError("You forgot to paste your FAL KEY. Get it from fal.ai/dashboard/keys");
  }

  const prompt = document.getElementById('prompt').value;
  const styleText = document.getElementById('style').selectedOptions[0].text;
  const style = document.getElementById('style').value;
  if(!prompt) return alert("Please enter a prompt");
  if(mode === 'video' &&!window.Clerk?.user) return Clerk.openSignIn();

  const finalPrompt = prompt + style + ", 8k, highly detailed";
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('status');
  btn.disabled = true; status.innerText = "Generating... Please wait";

  try {
    let url = mode==='image'? await genImage(finalPrompt, status) : await genVideo(finalPrompt, status);
    lastGenerated = {url, type: mode, prompt: prompt + " | Style: " + styleText};
    document.getElementById('result').innerHTML = mode==='image'? `<img src="${url}">` : `<video src="${url}" controls autoplay loop></video>`;
    document.getElementById('postBtn').classList.remove('hidden');
    status.innerText = "Done! Click 'Post to Feed'";
  } catch(e) {
    status.innerText = "";
    showError(e.message);
    console.error(e);
  }
  btn.disabled = false;
}

document.getElementById('postBtn').onclick = () => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  feed.unshift({
    id: Date.now(),
    user: Clerk.user.emailAddresses[0].emailAddress.split('@')[0],
    userId: Clerk.user.id,
    media_url: lastGenerated.url,
    type: lastGenerated.type,
    prompt: lastGenerated.prompt,
    likes: [],
    comments: [],
    created_at: Date.now()
  });
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  document.getElementById('postBtn').classList.add('hidden');
  document.getElementById('prompt').value = '';
  document.getElementById('result').innerHTML = '';
  document.getElementById('status').innerText = 'Posted! ✅';
  loadFeed();
}

async function genImage(prompt, status) {
  status.innerText = "Generating image... ~5 seconds";
  const res = await fetch(IMAGE_URL, {method:"POST", headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN,"Content-Type":"application/json"}, body:JSON.stringify({prompt})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.detail || "Image generation failed. Check your Fal key and billing.");
  return data.images[0].url;
}

async function genVideo(prompt, status) {
  const res = await fetch(VIDEO_URL, {method:"POST", headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN,"Content-Type":"application/json"}, body:JSON.stringify({prompt, duration:"5"})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.detail || "Video generation failed");
  const request_id = data.request_id;
  status.innerText = "Generating video... ~30-40 seconds";
  while(true) {
    await new Promise(r=>setTimeout(r,3000));
    const statusRes = await fetch(`https://queue.fal.run/fal-ai/kling-video/v1.6/requests/${request_id}/status`, {headers:{"Authorization":"Key "+FAL_BROWSER_TOKEN}});
    const final = await statusRes.json();
    if(final.response?.video) return final.response.video.url;
    if(final.status === 'FAILED') throw new Error("Video generation failed");
  }
}

function loadFeed() {
  const feedDiv = document.getElementById('feed');
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  if(feed.length === 0) {
    feedDiv.innerHTML = '<div class="box empty-feed">No posts yet. Generate and post the first one! 🚀</div>';
    return;
  }
  feedDiv.innerHTML = feed.map(p => `
    <div class="post" id="post-${p.id}">
      <div class="post-header">
        <div class="avatar">${p.user[0].toUpperCase()}</div>
        <div class="post-user">${p.user}</div>
      </div>
      ${p.type==='image'? `<img src="${p.media_url}">` : `<video src="${p.media_url}" controls></video>`}
      <div class="post-actions">
        <button onclick="toggleLike(${p.id})">❤️</button>
        <button onclick="document.getElementById('comment-${p.id}').focus()">💬</button>
      </div>
      <div class="likes">${p.likes.length} likes</div>
      <div class="caption"><b>${p.user}</b> ${p.prompt}</div>
      <div class="comments" id="comments-${p.id}">
        ${p.comments.map(c=>`<div><b>${c.user}</b> ${c.text}</div>`).join('')}
      </div>
      <div class="comment-input">
        <input id="comment-${p.id}" placeholder="Add a comment...">
        <button onclick="addComment(${p.id})">Post</button>
      </div>
    </div>
  `).join('');
}

window.toggleLike = (id) => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  let post = feed.find(p=>p.id===id);
  const user = Clerk.user.emailAddresses[0].emailAddress.split('@')[0];
  if(post.likes.includes(user)) post.likes = post.likes.filter(u=>u!==user);
  else post.likes.push(user);
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  loadFeed();
}

window.addComment = (id) => {
  if(!window.Clerk?.user) return Clerk.openSignIn();
  const input = document.getElementById(`comment-${id}`);
  if(!input.value.trim()) return;
  let feed = JSON.parse(localStorage.getItem(BOOK_KEY) || '[]');
  let post = feed.find(p=>p.id===id);
  post.comments.push({user: Clerk.user.emailAddresses[0].emailAddress.split('@')[0], text: input.value});
  localStorage.setItem(BOOK_KEY, JSON.stringify(feed));
  input.value = '';
  loadFeed();
}
</script>
</body>
</html>
